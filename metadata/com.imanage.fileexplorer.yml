AutoName: I Manage
Summary: Privacy-first, ultra-secure, 100% offline Android File Explorer

Description: |-
  I Manage is an ultra-secure, privacy-first file manager designed with a strict zero-telemetry policy.
  
  Key Features:
  * Hardware-Backed Safe Vault: AES-256 encrypted storage via Android KeyStore.
  * DoD File Shredder: Multi-pass permanent data overwrite.
  * Local Wi-Fi PC Transfer: Bidirectional wireless file upload and download on local Wi-Fi.
  * Advanced Compression: Password-protected encrypted ZIP creation and multi-archive extraction (.zip, .tar.gz, .tgz).
  * Smart Duplicate Cleaner: Two-stage SHA-256 hash detection to reclaim disk storage.
  * Built-in Offline Media Viewers: Integrated background Audio Player, native Video Player, PDF Viewer, and Image Viewer.
  * Custom Color Tags: Tag documents with color badges for instant organization.
  * Master PIN & Auto-Lock: PBKDF2 encrypted PIN with configurable auto-lock timeout.

